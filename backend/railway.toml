# Railway Configuration — Natural OS Backend

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node dist/main"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 60

[[deploy.envs]]
name = "PORT"
value = "3001"
