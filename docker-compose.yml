services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: naturapos
      POSTGRES_PASSWORD: naturapos
      POSTGRES_DB: naturalos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    depends_on:
      - postgres
    environment:
      PORT: 3001
      NODE_ENV: development
      DATABASE_URL: postgresql://naturapos:naturapos@postgres:5432/naturalos?schema=public
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: development-secret
      JWT_EXPIRES_IN: 7d
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"

volumes:
  postgres_data: